<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فروش لپتاپ | فروشگاه لپ‌تاپ</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF6;--card:#fff;--ink:#0B1B3A;--mute:#667085;--line:#D9DFE8;--acc:#14284B;--acc-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0A1224;--card:#111B33;--ink:#EAEEF5;--mute:#98A2B3;--line:#23325A;--acc:#8FB0F5;--acc-ink:#0A1330}}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:1.3rem}
.cart-btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;padding:56px 5vw}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.3;margin:0 0 12px;font-weight:800}
.hero p{color:var(--mute);max-width:46ch;margin:0 0 20px}
.hero a{display:inline-block;background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:10px;text-decoration:none;font-weight:600}
.lap{width:100%;max-width:340px;margin:auto}
.lap .scr{aspect-ratio:16/10;border:6px solid #2A303C;border-radius:10px 10px 0 0;background:linear-gradient(135deg,var(--c1,#1F4BFF),var(--c2,#0B1E6B))}
.lap .base{height:10px;background:#2A303C;border-radius:0 0 14px 14px;width:112%;margin:0 -6%}
.hero-img{width:100%;max-width:560px;margin:auto;display:block;border-radius:18px;border:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:10px;padding:0 5vw 20px}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tools input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:0 5vw 48px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.p .lap{max-width:200px;margin-bottom:10px}
.pic{width:100%;aspect-ratio:16/10;object-fit:contain;margin-bottom:10px;border-radius:8px;background:#fff}
.p h3{margin:0;font-size:1.05rem}
.p small{color:var(--mute)}
.price{font-weight:800;font-size:1.1rem;margin-top:auto}
.p button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:8px;cursor:pointer;font-weight:600}
#drawer{position:fixed;inset:0 auto 0 0;width:min(360px,100%);background:var(--card);border-inline-end:1px solid var(--line);transform:translateX(-102%);transition:transform .25s;z-index:10;padding:20px;display:flex;flex-direction:column}
#drawer.open{transform:none}
